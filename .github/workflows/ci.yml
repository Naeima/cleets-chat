name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      # The static site must be rebuilt when the graphs or the Python modules change.
      - run: python build_site.py && git diff --quiet -- docs/py || (echo "docs/py is out of date: run python build_site.py and commit" && exit 1)
